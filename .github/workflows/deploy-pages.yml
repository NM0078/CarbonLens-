name: Deploy CarbonLens preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build site
        run: pnpm build
        env:
          # ที่อยู่หลังบ้าน ตั้งที่ repo > Settings > Secrets and variables > Actions > Variables
          # ถ้ายังไม่ตั้ง หน้าเว็บจะแจ้งว่ายังไม่ได้ตั้งค่าหลังบ้าน และเข้าสู่ระบบไม่ได้
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
